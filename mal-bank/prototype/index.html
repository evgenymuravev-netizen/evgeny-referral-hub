/* ---------- Design tokens — Noor (noor finance) ----------
   Calm, self-assured fintech. Terracotta is the brand; Electric Blue is auxiliary.
   Sora for titles & buttons, Onest for body & numbers, Rubik for labels. */
:root {
  color-scheme: light;
  --ground:#f7f8fa; --panel:#ffffff; --panel-2:#f7f8fa;
  --ink:#000000; --ink-2:#1b1b1d; --muted:#545454; --faint:#8d8d8d;
  --brand:#ff6757; --brand-2:#ff8579; --brand-ink:#cc3f2c; --brand-soft:#fff1ee;
  --accent:#cc3f2c; --accent-strong:#a8321f; --accent-soft:#fff1ee;
  --sky:#337dff; --sky-ink:#1f5fd6; --sky-soft:#eef4ff;
  --brass:#8d8d8d;
  --ok:#1e8e5a; --warn:#b3690a; --bad:#c42e43;
  --ok-soft:#e8f6ee; --warn-soft:#fff6e8; --bad-soft:#fdecee;
  --tint-iris:#fff1ee;
  --hairline:#e3e4e7; --hairline-soft:#edeef0;
  --grid:#f0f1f3; --axis:#bababb;
  --c-approve:#1e8e5a; --c-refer:#c98a2b; --c-decline:#c42e43;
  --s1:#ff6757; --s2:#337dff; --s3:#bababb; --meter-track:#edeef0; --corridor:rgba(51,125,255,.08);
  --font-display:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ui:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-label:'Rubik','Onest',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --font-ar:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
  --radius-sm:8px; --radius-md:12px; --radius:20px; --radius-lg:20px; --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(23,23,26,.04);
  --shadow:0 1px 2px rgba(23,23,26,.04), 0 8px 24px -12px rgba(23,23,26,.10);
  --shadow-md:0 2px 4px rgba(23,23,26,.04), 0 16px 32px -14px rgba(23,23,26,.16);
  --focus-ring:rgba(51,125,255,.45);
  --brand-card:
    radial-gradient(70% 90% at 0% 100%, rgba(255,103,87,.55) 0%, transparent 62%),
    radial-gradient(60% 80% at 100% 0%, rgba(51,125,255,.45) 0%, transparent 60%),
    linear-gradient(160deg, #0b1230 0%, #111127 55%, #1d1220 100%);
  --dur-fast:120ms; --dur-base:200ms; --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --ground:#111113; --panel:#18181b; --panel-2:#1e1e22;
    --ink:#f2f1ee; --ink-2:#e4e3df; --muted:#b7b5b0; --faint:#8b8a86;
    --brand:#ff8579; --brand-2:#ff9d93; --brand-ink:#ff8579; --brand-soft:#3a1c17;
    --accent:#ff8579; --accent-strong:#ffa49b; --accent-soft:rgba(255,133,121,.14);
    --sky:#7fabff; --sky-ink:#7fabff; --sky-soft:#152238;
    --brass:#8b8a86;
    --ok:#4cc38a; --warn:#f0b444; --bad:#f2707f;
    --ok-soft:rgba(76,195,138,.14); --warn-soft:rgba(240,180,68,.13); --bad-soft:rgba(242,112,127,.14);
    --tint-iris:rgba(255,133,121,.14);
    --hairline:#2c2c31; --hairline-soft:#232327;
    --grid:#1f1f23; --axis:#45454b;
    --c-approve:#4cc38a; --c-refer:#f0b444; --c-decline:#f2707f;
    --s1:#ff8579; --s2:#7fabff; --s3:#5a5a60; --meter-track:#2c2c31; --corridor:rgba(127,171,255,.10);
    --shadow-xs:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-md:0 2px 4px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.6);
    --focus-ring:rgba(127,171,255,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#111113; --panel:#18181b; --panel-2:#1e1e22;
  --ink:#f2f1ee; --ink-2:#e4e3df; --muted:#b7b5b0; --faint:#8b8a86;
  --brand:#ff8579; --brand-2:#ff9d93; --brand-ink:#ff8579; --brand-soft:#3a1c17;
  --accent:#ff8579; --accent-strong:#ffa49b; --accent-soft:rgba(255,133,121,.14);
  --sky:#7fabff; --sky-ink:#7fabff; --sky-soft:#152238;
  --brass:#8b8a86;
  --ok:#4cc38a; --warn:#f0b444; --bad:#f2707f;
  --ok-soft:rgba(76,195,138,.14); --warn-soft:rgba(240,180,68,.13); --bad-soft:rgba(242,112,127,.14);
  --tint-iris:rgba(255,133,121,.14);
  --hairline:#2c2c31; --hairline-soft:#232327;
  --grid:#1f1f23; --axis:#45454b;
  --c-approve:#4cc38a; --c-refer:#f0b444; --c-decline:#f2707f;
  --s1:#ff8579; --s2:#7fabff; --s3:#5a5a60; --meter-track:#2c2c31; --corridor:rgba(127,171,255,.10);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-md:0 2px 4px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.6);
  --focus-ring:rgba(127,171,255,.5);
}

/* ---------- Base ---------- */
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body { background:var(--ground); color:var(--ink-2); font:14.5px/1.55 var(--font-ui); letter-spacing:-.1px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
h1,h2,h3,h4 { margin:0; font-family:var(--font-display); font-weight:600; color:var(--ink); letter-spacing:0; }
p { margin:.4em 0; }
a { color:var(--accent); text-decoration:none; }
a:hover { color:var(--accent-strong); text-decoration:underline; text-underline-offset:2px; }
button { font:inherit; color:inherit; }
code, .mono { font-family:var(--font-mono); font-size:.86em; }
:focus-visible { outline:2px solid var(--sky); outline-offset:2px; }
::selection { background:var(--brand-soft); }
.ar { font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate; }
.num { font-family:var(--font-ui); font-variant-numeric:tabular-nums; }
.muted { color:var(--muted); }
.small { font-size:12px; }
hr.rule { border:0; border-top:1px solid var(--hairline-soft); margin:14px 0; }

/* ---------- Fatal banner ---------- */
#fatal-banner { display:none; position:sticky; top:0; z-index:99; background:var(--bad); color:#fff;
  padding:10px 16px; font-family:var(--font-mono); font-size:12.5px; white-space:pre-wrap; }
#fatal-banner.show { display:block; }

/* ---------- Layout ---------- */
.app { display:flex; min-height:100vh; }
.sidebar { width:252px; flex:0 0 252px; background:var(--panel); border-right:1px solid var(--hairline-soft);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.wordmark { margin:12px; padding:18px 16px 15px; border-radius:var(--radius); background:var(--brand-card);
  position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px; }
.wordmark .noor-logo { background:#ff6757; }
.wordmark .wm-sub { font-family:var(--font-label); font-size:12px; font-weight:400; color:rgba(255,255,255,.78);
  letter-spacing:0; line-height:1.35; }
.wordmark .wm-sub b { color:#fff; font-weight:500; }
nav.mainnav { padding:4px 10px 8px; display:flex; flex-direction:column; gap:2px; flex:1; overflow:auto; }
.navbtn { display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0;
  border-radius:var(--radius-md); padding:9px 12px; cursor:pointer; color:var(--ink);
  font-family:var(--font-ui); font-size:14px; font-weight:500; letter-spacing:-.1px;
  transition:background var(--dur-fast) var(--ease-out); }
.navbtn svg { display:block; flex:0 0 16px; width:16px; height:16px; color:var(--faint); }
.navbtn:hover { background:var(--panel-2); }
.navbtn.active { background:var(--brand-soft); color:var(--ink); }
.navbtn.active svg { color:var(--brand); }
.navbtn .nsub { display:block; font-family:var(--font-label); font-size:11.5px; color:var(--faint); font-weight:400; letter-spacing:0; margin-top:1px; }
.navbtn.active .nsub { color:var(--muted); }
.sidefoot { padding:12px 16px 14px; border-top:1px solid var(--hairline-soft); display:flex; flex-direction:column; gap:9px; }
.synthetic-badge { font-family:var(--font-label); font-size:11px; line-height:1.5; color:var(--faint); background:none;
  border:0; border-top:1px solid var(--hairline-soft); padding:8px 0 0; letter-spacing:0; }
.versions { font-size:10.5px; color:var(--faint); font-family:var(--font-mono); letter-spacing:0; }
.theme-btn { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--hairline);
  border-radius:var(--radius-pill); padding:6px 13px; cursor:pointer; font-family:var(--font-label); font-size:12px; font-weight:500;
  letter-spacing:0; color:var(--muted);
  transition:color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.theme-btn:hover { color:var(--ink); border-color:var(--ink); }
.theme-btn:active { transform:scale(.97); }

main.content { flex:1; min-width:0; padding:28px 36px 64px; max-width:1300px; }
section[data-screen] { display:none; }
section[data-screen].active { display:block; }
.screen-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.screen-head h1 { font-family:var(--font-display); font-size:clamp(26px,3vw,32px); font-weight:700; letter-spacing:-.01em; line-height:1.2; text-wrap:balance; }
.screen-head h1 i { font-style:normal; color:var(--brand); }
.screen-head .sub { color:var(--muted); font-size:15px; margin-top:8px; max-width:760px; line-height:1.5; }
.screen-head .eyebrow { font-family:var(--font-label); font-size:12.5px; font-weight:500; letter-spacing:.02em; color:var(--brand-ink);
  margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.screen-head .eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--brand); flex:0 0 auto; }
.chip-synth { flex:0 0 auto; font-family:var(--font-label); font-size:11.5px; font-weight:500; letter-spacing:0;
  color:var(--warn); border:0; border-radius:var(--radius-pill); padding:5px 12px; background:var(--warn-soft); white-space:nowrap; margin-top:6px; }

/* ---------- Panels & grids ---------- */
.panel { background:var(--panel); border:1px solid var(--hairline-soft); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; }
.panel + .panel { margin-top:14px; }
.panel h3 { font-family:var(--font-display); font-size:15.5px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--ink);
  margin-bottom:12px; border-bottom:1px solid var(--hairline-soft); padding-bottom:10px; }
.panel h3 .h3-note { font-family:var(--font-ui); font-size:13px; font-weight:400; color:var(--faint); }
.grid2 { display:grid; grid-template-columns:minmax(340px,5fr) minmax(380px,6fr); gap:14px; align-items:start; }
.grid-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
@media (max-width:1100px) { .grid2 { grid-template-columns:1fr; } }

/* ---------- Buttons (Sora bold labels, black primary — as in the Noor app) ---------- */
.btn { background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:9px 16px;
  cursor:pointer; font-family:var(--font-display); font-size:13px; font-weight:600; letter-spacing:0; color:var(--ink);
  transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.btn:hover { border-color:var(--ink); }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--ink); border-color:var(--ink); color:var(--ground); font-weight:700; }
.btn-primary:hover { opacity:.88; border-color:var(--ink); color:var(--ground); }
.btn-ghost { border-color:transparent; color:var(--muted); background:transparent; }
.btn-ghost:hover { color:var(--ink); border-color:transparent; }
.btn[disabled] { opacity:.4; cursor:not-allowed; transform:none; }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

/* ---------- Chips / outcome badges (Rubik labels, pill tags) ---------- */
.chip { display:inline-flex; align-items:center; gap:5px; border-radius:var(--radius-pill); padding:3px 10px;
  font-family:var(--font-label); font-size:12px; font-weight:400; letter-spacing:0;
  border:1px solid var(--hairline); color:var(--muted); background:var(--panel); white-space:nowrap; }
.chip.acc { color:var(--brand-ink); border-color:var(--brand); background:transparent; }
.oc { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-label); font-weight:500; border-radius:var(--radius-pill);
  padding:3px 11px; font-size:12px; letter-spacing:.02em; text-transform:uppercase; }
.oc-APPROVE { color:var(--ok); background:var(--ok-soft); border:0; }
.oc-REFER { color:var(--warn); background:var(--warn-soft); border:0; }
.oc-DECLINE { color:var(--bad); background:var(--bad-soft); border:0; }
.res-PASS { color:var(--ok); } .res-FAIL { color:var(--bad); } .res-REFER { color:var(--warn); }
.grade-chip { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px;
  border-radius:var(--radius-pill); font-family:var(--font-display); font-weight:700; font-size:14px;
  background:var(--ink); color:var(--ground); border:0; }

/* ---------- Outcome banner ---------- */
.outcome-banner { border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border:1px solid transparent; }
.outcome-banner.APPROVE { background:var(--ok-soft); }
.outcome-banner.REFER { background:var(--warn-soft); }
.outcome-banner.DECLINE { background:var(--bad-soft); }
.outcome-banner .ob-word { font-family:var(--font-display); font-size:24px; font-weight:800; letter-spacing:-.005em; line-height:1; }
.outcome-banner.APPROVE .ob-word { color:var(--ok); }
.outcome-banner.REFER .ob-word { color:var(--warn); }
.outcome-banner.DECLINE .ob-word { color:var(--bad); }
.outcome-banner .ob-meta { font-size:13px; color:var(--muted); }

/* ---------- Forms ---------- */
.field { margin-bottom:12px; }
.field label { display:block; font-family:var(--font-label); font-size:13px; font-weight:500; letter-spacing:0; text-transform:none;
  color:var(--muted); margin-bottom:6px; }
.field input[type=number], .field input[type=text], .field select, .field textarea {
  width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--hairline);
  border-radius:var(--radius-md); padding:9px 12px; font:14px var(--font-ui); font-variant-numeric:tabular-nums; }
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--ink); outline:none; box-shadow:0 0 0 3px var(--focus-ring); }
.field input[type=range] { width:100%; accent-color:var(--brand); }
.field .bounds { font-family:var(--font-label); font-size:12px; color:var(--faint); letter-spacing:0; }
.slider-row { display:grid; grid-template-columns:1fr 120px; gap:10px; align-items:center; }
.consent-box { border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; background:var(--panel-2); }
.consent-box input[type=checkbox] { margin-top:3px; accent-color:var(--brand); width:16px; height:16px; }
.consent-box .cb-title { font-family:var(--font-ui); font-weight:600; font-size:14px; color:var(--ink); }
.consent-box .cb-legal { font-size:12.5px; color:var(--muted); margin-top:2px; }
.callout { border-radius:var(--radius-md); padding:12px 14px; font-size:13px; border:0; margin-top:10px; }
.callout-error { background:var(--bad-soft); }
.callout-warn { background:var(--warn-soft); }
.callout-info { background:var(--sky-soft); }
.callout-ok { background:var(--ok-soft); }
.callout .co-title { font-family:var(--font-label); font-size:12.5px; letter-spacing:0; text-transform:none; font-weight:500; margin-bottom:3px; }
.callout-error .co-title { color:var(--bad); }
.callout-warn .co-title { color:var(--warn); }
.callout-info .co-title { color:var(--sky-ink); }
.callout-ok .co-title { color:var(--ok); }
.callout-error { color:var(--bad); }
.callout .co-body { color:var(--ink-2); }

/* ---------- Persona cards ---------- */
.pcard { text-align:left; background:var(--panel); border:1px solid var(--hairline-soft); border-radius:var(--radius-md);
  box-shadow:var(--shadow-xs); padding:13px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
  transition:box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.pcard:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.pcard.sel { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset, var(--shadow-xs); background:var(--brand-soft); }
.pcard .pname { font-family:var(--font-display); font-weight:600; font-size:14px; color:var(--ink); display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.pcard .pname .ar { font-size:13px; color:var(--faint); font-weight:400; }
.pcard .ptag { font-size:12.5px; color:var(--muted); line-height:1.4; }
.pcard .pchips { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }

/* ---------- Orchestration timeline ---------- */
.timeline { display:flex; flex-direction:column; gap:0; }
.t-step { display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--hairline-soft); align-items:flex-start; opacity:1; }
.t-step:last-child { border-bottom:0; }
.t-step.pending { opacity:.3; }
.t-step .t-dot { flex:0 0 9px; width:9px; height:9px; border-radius:50%; background:var(--brand); margin-top:6px;
  box-shadow:0 0 0 3px var(--brand-soft); }
.t-step.pending .t-dot { background:var(--faint); box-shadow:none; }
.t-step .t-main { flex:1; min-width:0; }
.t-step .t-title { font-size:14px; font-weight:600; color:var(--ink); }
.t-step .t-sum { font-size:12px; color:var(--muted); font-family:var(--font-mono); overflow-wrap:anywhere; }
.t-step .t-lat { flex:0 0 auto; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--faint); margin-top:3px; }

/* ---------- KV + tables ---------- */
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13.5px; }
.kv dt { color:var(--muted); font-family:var(--font-label); font-size:13px; letter-spacing:0; padding-top:1px; }
.kv dd { margin:0; color:var(--ink-2); }
.tbl { width:100%; border-collapse:collapse; font-size:13.5px; }
.tbl th { text-align:left; font-family:var(--font-label); font-size:12px; text-transform:none; letter-spacing:0;
  color:var(--faint); border-bottom:1px solid var(--hairline); padding:8px 10px; font-weight:500; background:var(--panel-2); }
.tbl td { padding:8px 10px; border-bottom:1px solid var(--hairline-soft); vertical-align:top; }
.tbl tr:last-child td { border-bottom:0; }
.tbl td.num, .tbl th.num { text-align:right; font-family:var(--font-ui); font-variant-numeric:tabular-nums; }
.tbl tbody tr.rowbtn { cursor:pointer; }
.tbl tbody tr.rowbtn:hover td { background:var(--panel-2); }
.tbl tbody tr.sel td { background:var(--brand-soft); }
.tbl-scroll { overflow-x:auto; border-radius:var(--radius-md); }

/* ---------- Execution steps ---------- */
.exec-steps { display:flex; flex-direction:column; gap:6px; }
.estep { display:flex; align-items:center; gap:11px; border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:10px 12px;
  background:var(--panel); cursor:pointer; text-align:left; width:100%;
  transition:border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
.estep:hover { border-color:var(--ink); }
.estep:active { transform:scale(.99); }
.estep.done { border-color:transparent; background:var(--ok-soft); cursor:default; }
.estep .es-n { flex:0 0 26px; width:26px; height:26px; border-radius:50%; border:1px solid var(--hairline);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:12px; font-weight:700; }
.estep.done .es-n { background:var(--ok); border-color:var(--ok); color:#fff; }
.estep .es-t { font-weight:600; font-size:13.5px; color:var(--ink); }
.estep .es-d { font-size:12px; color:var(--muted); }
.estep .es-at { margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ok); }

/* ---------- Limit trace ---------- */
.trace { display:flex; flex-direction:column; gap:4px; }
.trace-row { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:6px 10px; border-radius:var(--radius-sm); border:0; }
.trace-row .tval { font-family:var(--font-ui); font-variant-numeric:tabular-nums; }
.trace-row.binding { background:var(--brand-soft); font-weight:600; color:var(--ink); }

/* ---------- Meters, tiles (Numbers/H3: Onest Bold, tabular) ---------- */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
.tile { background:var(--panel); border:1px solid var(--hairline-soft); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; }
.tile .t-label { font-family:var(--font-label); font-size:13px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); }
.tile .t-value { font-size:28px; font-weight:700; font-family:var(--font-ui); font-variant-numeric:tabular-nums; letter-spacing:-.01em; color:var(--ink); margin:4px 0 2px; }
.tile .t-delta { font-size:12.5px; display:flex; align-items:center; gap:4px; }
.tile .t-delta.good { color:var(--ok); } .tile .t-delta.bad { color:var(--bad); }
.meter { position:relative; height:8px; border-radius:var(--radius-pill); background:var(--meter-track); margin-top:10px; overflow:visible; }
.meter .m-fill { position:absolute; inset:0 auto 0 0; border-radius:var(--radius-pill); background:var(--s1); }
.meter .m-target { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.6; border-radius:1px; }
.meter-cap { display:flex; justify-content:space-between; font-family:var(--font-label); font-size:11.5px; color:var(--faint); margin-top:5px; letter-spacing:0; font-variant-numeric:tabular-nums; }

/* ---------- Charts ---------- */
.chart-box { position:relative; }
.chart-box svg { display:block; width:100%; height:auto; }
.chart-box svg text { font-family:var(--font-label); font-size:10.5px; fill:var(--faint); }
.chart-box svg .ticknum { font-variant-numeric:tabular-nums; }
.chart-box svg .dlabel { fill:var(--ink); font-weight:500; }
.viz-tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--hairline);
  border-radius:var(--radius-md); box-shadow:var(--shadow-md); padding:8px 11px; font-size:12px; display:none; z-index:5; min-width:130px; }
.viz-tip .vt-title { font-family:var(--font-label); color:var(--faint); font-size:11.5px; letter-spacing:0; text-transform:none; font-weight:500; margin-bottom:3px; }
.viz-tip .vt-row { display:flex; align-items:center; gap:6px; }
.viz-tip .vt-key { width:10px; height:0; border-top:3px solid; border-radius:2px; }
.viz-tip .vt-val { font-variant-numeric:tabular-nums; font-weight:600; margin-left:auto; padding-left:10px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-family:var(--font-label); font-size:12px; color:var(--muted); margin:4px 0 2px; letter-spacing:0; }
.legend .lg { display:inline-flex; align-items:center; gap:6px; }
.legend .sw { width:10px; height:10px; border-radius:3px; display:inline-block; }
.legend .swl { width:12px; height:0; border-top:3px solid; border-radius:2px; display:inline-block; }
details.tbl-view { margin-top:8px; }
details.tbl-view summary { cursor:pointer; font-family:var(--font-label); font-size:12px; color:var(--muted); letter-spacing:0; }
details.tbl-view table { margin-top:6px; }
.callouts-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }

/* ---------- Policy console ---------- */
.lockrow td:first-child { white-space:nowrap; }
.lock-ico { color:var(--faint); margin-right:6px; }
.param-changed { color:var(--brand-ink); font-weight:700; }
.diff-chip { font-family:var(--font-mono); font-size:11.5px; background:var(--brand-soft); border-radius:var(--radius-pill); padding:2px 8px; }

/* ---------- Overview ---------- */
.pos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; }
.pos { border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:14px 16px; background:var(--panel); box-shadow:var(--shadow-xs); }
.pos .p-n { font-family:var(--font-label); color:var(--brand-ink); font-size:12px; font-weight:500; letter-spacing:.02em; }
.pos .p-n::before { content:"0"; }
.pos .p-t { font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--ink); margin:4px 0 3px; }
.pos .p-d { font-size:13px; color:var(--muted); line-height:1.45; }
.demo-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; }
.demo-step { border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:12px 14px; background:var(--panel); text-align:left; cursor:pointer;
  transition:box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.demo-step:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); }
.demo-step .d-n { font-family:var(--font-label); font-size:12px; color:var(--brand-ink); font-weight:500; letter-spacing:0; text-transform:none; }
.demo-step .d-t { font-family:var(--font-display); font-weight:600; font-size:13.5px; color:var(--ink); }
.demo-step .d-d { font-size:12px; color:var(--muted); }

/* ---------- Boot error ---------- */
#boot-error { display:none; margin:40px auto; max-width:640px; }
#boot-error.show { display:block; }

/* ---------- Responsive: sidebar -> tab bar ---------- */
@media (max-width:900px) {
  .app { flex-direction:column; }
  .sidebar { width:100%; flex:none; height:auto; position:sticky; top:0; z-index:20; flex-direction:column; border-right:0; border-bottom:1px solid var(--hairline-soft); }
  nav.mainnav { flex-direction:row; overflow-x:auto; padding:4px 10px 8px; }
  .navbtn { white-space:nowrap; width:auto; padding:8px 13px; align-items:center; }
  .navbtn .nsub { display:none; }
  .wordmark { margin:10px 12px 4px; padding:12px 14px; flex-direction:row; align-items:center; justify-content:space-between; }
  .wordmark .noor-logo { width:84px; }
  .sidefoot { flex-direction:row; align-items:center; justify-content:space-between; padding:6px 12px; border-top:1px solid var(--hairline-soft); }
  .synthetic-badge { border-top:0; padding:0; }
  .versions { display:none; }
  main.content { padding:18px 16px 50px; }
}

/* ---------- Motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
}

/* ---------- Noor additions ---------- */
:root { --brand-fill:#d4412b; } /* selected states: white text at 4.6:1 in both themes */
/* Column stacks: consistent 14px rhythm between panels and slot containers; empty slots collapse */
.stack { display:flex; flex-direction:column; gap:14px; min-width:0; }
.stack > :empty { display:none; }
.stack > .panel + .panel { margin-top:0; }

/* Detected-purchase card (subtle brand-soft surface) */
.purchase-card { background:var(--brand-soft); border:1px solid var(--hairline-soft); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-xs); }
.purchase-card .pc-eyebrow { font-family:var(--font-label); font-size:12.5px; font-weight:500; color:var(--brand-ink);
  display:flex; align-items:center; gap:8px; }
.purchase-card .pc-copy { font-family:var(--font-display); font-size:19px; font-weight:600; line-height:1.32; color:var(--ink);
  margin:10px 0 4px; letter-spacing:-.005em; }
.purchase-card .pc-copy em { font-style:normal; color:var(--brand-ink); }
.purchase-card .pc-via { font-size:12.5px; color:var(--muted); margin-bottom:12px; }
.purchase-card .pc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px 16px;
  border-top:1px solid var(--hairline); padding-top:12px; }
.purchase-card .pc-k { display:block; font-family:var(--font-label); font-size:12px; color:var(--muted); }
.purchase-card .pc-v { display:block; font-size:14px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.purchase-card .pc-empty { font-size:13px; color:var(--muted); }

/* Plan selector — stacked rows, selected row filled with the brand terracotta */
.plan-list { display:flex; flex-direction:column; gap:8px; }
.plan-row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--hairline); border-radius:var(--radius-md); padding:12px 16px; cursor:pointer; color:var(--ink);
  transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.plan-row:hover { border-color:var(--ink); }
.plan-row:active { transform:scale(.99); }
.plan-row .pr-dot { flex:0 0 18px; width:18px; height:18px; border-radius:50%; border:2px solid var(--hairline); background:var(--panel); }
.plan-row .pr-main { flex:1; min-width:0; }
.plan-row .pr-name { display:block; font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--ink); }
.plan-row .pr-apr { display:block; font-family:var(--font-label); font-size:11.5px; color:var(--faint); margin-top:1px; }
.plan-row .pr-why { display:block; font-family:var(--font-label); font-size:11.5px; color:var(--warn); margin-top:2px; }
.plan-row .pr-right { flex:0 0 auto; text-align:right; }
.plan-row .pr-pay { display:block; font-family:var(--font-ui); font-size:17px; font-weight:700; color:var(--ink);
  font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.plan-row .pr-fee { display:block; font-family:var(--font-label); font-size:12px; color:var(--muted); }
.plan-row.sel { background:var(--brand-fill); border-color:var(--brand-fill); }
.plan-row.sel:hover { border-color:var(--brand-fill); }
.plan-row.sel .pr-name, .plan-row.sel .pr-apr, .plan-row.sel .pr-pay, .plan-row.sel .pr-fee { color:#fff; }
.plan-row.sel .pr-dot { border-color:#fff; background:var(--brand-fill); box-shadow:inset 0 0 0 3px var(--brand-fill), inset 0 0 0 9px #fff; }
.plan-row[disabled] { cursor:not-allowed; background:var(--panel-2); border-style:dashed; transform:none; }
.plan-row[disabled]:hover { border-color:var(--hairline); }
.plan-row[disabled] .pr-name, .plan-row[disabled] .pr-pay { color:var(--faint); }
.plan-row.sel[disabled] { border-style:solid; background:var(--brand-fill); }
.plan-row.sel[disabled] .pr-name, .plan-row.sel[disabled] .pr-pay { color:#fff; }
.plan-note { font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.45; }

/* Offer strip — approved amount · plan · split capacity */
.offer-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
.offer-strip .os { border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:12px 14px; background:var(--panel); min-width:0; }
.offer-strip .os-l { font-family:var(--font-label); font-size:12px; color:var(--muted); }
.offer-strip .os-v { font-family:var(--font-ui); font-size:22px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;
  letter-spacing:-.01em; line-height:1.25; overflow-wrap:anywhere; }
.offer-strip .os-s { font-size:12px; color:var(--muted); }

/* KFS preview figures */
.kfs { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:8px; }
.kfs .kf { background:var(--panel-2); border:1px solid var(--hairline-soft); border-radius:var(--radius-md); padding:10px 12px; min-width:0; }
.kfs .kf-l { display:block; font-family:var(--font-label); font-size:12px; color:var(--muted); }
.kfs .kf-v { display:block; font-family:var(--font-ui); font-size:17px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere; line-height:1.3; }
.kfs .kf-s { display:block; font-size:11.5px; color:var(--faint); }
.kfs-foot { font-size:12px; color:var(--muted); margin-top:8px; }

/* "The freed cash goes to your goal" */
.freed { display:flex; align-items:flex-start; gap:10px; background:var(--brand-soft); border-radius:var(--radius-md);
  padding:12px 14px; margin-top:12px; }
.freed .noor-icon { flex:0 0 auto; margin-top:3px; }
.freed .fr-t { display:block; font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--ink); }
.freed .fr-s { display:block; font-size:12.5px; color:var(--muted); }

/* Semantic chips (state only — never the brand colour) */
.chip.chip-ok { color:var(--ok); background:var(--ok-soft); border-color:transparent; }
.chip.chip-warn { color:var(--warn); background:var(--warn-soft); border-color:transparent; }
.chip.chip-bad { color:var(--bad); background:var(--bad-soft); border-color:transparent; }

/* Segmented control (plan term in the "Split another purchase" check) */
.seg { display:inline-flex; border:1px solid var(--hairline); border-radius:var(--radius-pill); padding:3px; gap:2px; background:var(--panel); }
.seg button { border:0; background:none; border-radius:var(--radius-pill); padding:6px 13px; cursor:pointer;
  font-family:var(--font-display); font-size:12.5px; font-weight:600; color:var(--muted); }
.seg button:hover { color:var(--ink); }

/* Customer journey (v2.6) — a phone frame: Noor's web-view (Noor app style), a botim money CONCEPT host

  --bm-blue:#4152ff; --bm-blue-2:#6170ff; --bm-blue-ink:#a6aeff; --bm-yellow:#ffd84a;

  --ph-ground:#101116; --ph-chrome:#18191e; --ph-line:#2a2b31; --ph-bezel:#1d1d21; --ph-bezel-edge:#4a4a52;

function fmtSummaryVal(v) {

  if (typeof v === 'number') return Math.abs(v) >= 1000 ? fmtN(v) : String(v);
  if (v === null || v === undefined) return '—';

}
function pullSummary(p) {
  var parts = [];
  if (p.status) parts.push(p.status);

}
